[theme]
primaryColor = "#2a78d6"
baseRadius = "0.6rem"
font = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f1f0ec"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"

[theme.light.sidebar]
backgroundColor = "#ffffff"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#141413"
secondaryBackgroundColor = "#232321"
textColor = "#f0efec"
borderColor = "#383835"

[theme.dark.sidebar]
backgroundColor = "#1a1a19"

[server]
headless = true
runOnSave = false
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
